
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mandy's Buddy Icon Gallery</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px 16px;
 background:radial-gradient(circle at top,#203b60,#07101f 65%);
 color:#eef6ff;
 font-family:Arial,sans-serif;
}
main{max-width:900px;margin:auto}
header{text-align:center;margin-bottom:30px}
h1{font-size:32px;margin-bottom:8px}
p{color:#9db6d1}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
 gap:16px;
}
.item{
 display:flex;flex-direction:column;
 align-items:center;gap:12px;
 padding:18px 10px;
 background:linear-gradient(145deg,#172d49,#0c192c);
 border:1px solid #294967;
 border-radius:20px;
}
svg{width:72px;height:72px;
 filter:drop-shadow(0 4px 10px #56bfff55)}
.name{font-size:14px;font-weight:bold}
footer{text-align:center;margin-top:30px;color:#829bb8}
</style>
</head>
<body>
<main>
<header>
<h1>Mandy's Buddy</h1>
<p>Original SVG App Icon Library</p>
</header>
<div class="grid" id="gallery"></div>
<footer>MANDY'S BUDDY OS · 16 ICONS</footer>
</main>
<script>
const icons=[
["home","Home"],["photos","Photos"],
["messages","Messages"],["notes","Notes"],
["memories","Memories"],["calendar","Calendar"],
["reminders","Reminders"],["games","Games"],
["expressions","Expressions"],["settings","Settings"],
["sounds","Sounds"],["weather","Weather"],
["timer","Timer"],["connectivity","Connectivity"],
["battery","Battery"],["about","About"]
];
document.getElementById("gallery").innerHTML=
icons.map(([id,name])=>`
<article class="item">
<svg viewBox="0 0 64 64">
<use href="icons.svg#${id}"></use>
</svg>
<span class="name">${name}</span>
</article>
`).join("");
</script>
</body>
</html>
