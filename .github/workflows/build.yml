name: Mandy's Buddy OS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect repository structure
        run: |
          echo "CURRENT DIRECTORY:"
          pwd
          echo "ROOT FILES:"
          ls -la
          echo "PROJECT FILES:"
          find . -maxdepth 5 -type f | sort
          echo "APP HEADER SEARCH:"
          find . -iname "app.h" -print

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Compile Mandy's Buddy OS
        run: pio run
