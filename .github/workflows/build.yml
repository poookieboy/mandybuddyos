
name: Mandy's Buddy OS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install project dependencies
        run: pio pkg install

      - name: Compile firmware
        run: pio run

      - name: Verify firmware files
        run: |
          echo "Checking generated firmware..."
          ls -lh .pio/build/esp32-s3-devkitc-1/firmware.bin
          ls -lh .pio/build/esp32-s3-devkitc-1/bootloader.bin
          ls -lh .pio/build/esp32-s3-devkitc-1/partitions.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mandys-buddy-esp32s3-firmware
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/bootloader.bin
            .pio/build/esp32-s3-devkitc-1/partitions.bin
          if-no-files-found: error
          retention-days: 30
          
