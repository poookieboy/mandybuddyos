
name: Mandy's Buddy OS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Inspect repository structure
        run: |
          echo "CURRENT DIRECTORY:"
          pwd
          echo "ROOT FILES:"
          ls -la
          echo "PROJECT FILES:"
          find . -maxdepth 5 -type f | sort
          echo "APP HEADER SEARCH:"
          find . -iname "app.h" -print

      - name: Check ESP32 SPI framework files
        run: |
          echo "Searching for SPI.h..."
          find ~/.platformio/packages -type f -name "SPI.h" -print
          echo "Searching for SPI library..."
          find ~/.platformio/packages -type d -name "SPI" -print

      - name: Compile firmware
        run: pio run
        
