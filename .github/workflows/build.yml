
name: Mandy's Buddy OS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ESP32-S3 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Inspect repository
        run: |
          echo "CURRENT DIRECTORY:"
          pwd
          echo "PROJECT FILES:"
          find . -maxdepth 5 -type f | sort
          echo "APP HEADER SEARCH:"
          find . -iname "app.h" -print

      - name: Install project dependencies
        run: pio pkg install

      - name: Locate SPI framework files
        run: |
          echo "PLATFORMIO INFORMATION:"
          pio system info

          echo "SEARCHING FOR SPI.h:"
          find "$HOME/.platformio" -type f -name "SPI.h" -print

          echo "SEARCHING FOR SPI LIBRARY:"
          find "$HOME/.platformio" -type d -name "SPI" -print

      - name: Compile firmware
        run: pio run
        
